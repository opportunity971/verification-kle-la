<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification adhérent</title>
<style>
  :root {
    --encre: #111111;
    --papier: #fafaf8;
    --ligne: #d8d6d0;
    --erreur: #b3261e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--papier);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--encre);
    padding: 24px;
  }

  .carte {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }

  .logo {
    width: 88px;
    height: 88px;
    object-fit: contain;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 28px;
    color: #555;
  }

  .champ-code {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .champ-code input {
    width: 46px;
    height: 56px;
    text-align: center;
    font-size: 24px;
    border: 1.5px solid var(--ligne);
    border-radius: 8px;
    background: white;
    color: var(--encre);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .champ-code input:focus {
    border-color: var(--encre);
  }

  .champ-code.erreur input {
    border-color: var(--erreur);
    animation: secouer 0.3s ease;
  }

  @keyframes secouer {
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .message-erreur {
    font-size: 13px;
    color: var(--erreur);
    min-height: 18px;
    margin-bottom: 8px;
  }

  .resultat {
    display: none;
  }

  .resultat.visible {
    display: block;
  }

  .formulaire.masque {
    display: none;
  }

  .annee {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 8px 0 4px;
  }

  .nom-adherent {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 6px;
  }

  .sous-texte {
    font-size: 14px;
    color: #666;
  }

  .infos-urgence {
    display: none;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--ligne);
    text-align: left;
  }

  .infos-urgence.visible {
    display: block;
  }

  .infos-urgence h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #777;
    margin: 0 0 14px;
    text-align: center;
  }

  .info-ligne {
    margin-bottom: 12px;
  }

  .info-etiquette {
    font-size: 12px;
    color: #777;
    margin-bottom: 2px;
  }

  .info-valeur {
    font-size: 17px;
    font-weight: 600;
    word-break: break-word;
  }

  .info-valeur.vide {
    font-weight: 400;
    color: #999;
  }

  /* ===== Confirmation de réception du badge ===== */
  .bloc-remise {
    display: none;
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--ligne);
  }

  .bloc-remise.visible {
    display: block;
  }

  .lien-remise {
    font: inherit;
    font-size: 14px;
    color: var(--encre);
    background: none;
    border: 1.5px solid var(--ligne);
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
  }

  .lien-remise:hover { border-color: var(--encre); }

  .panneau-remise {
    display: none;
  }

  .panneau-remise.visible {
    display: block;
  }

  .panneau-remise p {
    margin: 0 0 16px;
  }

  .zone-signature {
    display: block;
    width: 100%;
    height: 150px;
    background: white;
    border: 1.5px dashed var(--ligne);
    border-radius: 10px;
    touch-action: none;
    cursor: crosshair;
  }

  .actions-remise {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 16px 0 12px;
  }

  .bouton-principal, .bouton-secondaire {
    font: inherit;
    font-size: 15px;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
    border: 1.5px solid var(--encre);
  }

  .bouton-principal { background: var(--encre); color: white; }
  .bouton-secondaire { background: white; color: var(--encre); }
  .bouton-principal:disabled { opacity: 0.5; cursor: default; }

  .message-remise {
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 14px;
    color: var(--erreur);
  }

  .message-remise.succes { color: #1b6e3c; font-weight: 600; }
</style>

</head>
<body>

<div class="carte">
  <img src="logo.png" alt="Logo" class="logo">

  <div class="formulaire" id="formulaire">
    <h1>Entrez le code adhérent</h1>
    <div class="champ-code" id="champCode">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off">
    </div>
    <div class="message-erreur" id="messageErreur"></div>
    <div class="bloc-remise" id="blocRemise">
      <button type="button" class="lien-remise" id="btnOuvrirRemise">J'ai reçu mon badge : confirmer la réception</button>
    </div>
  </div>

  <div class="panneau-remise" id="panneauRemise">
    <h1>Confirmer la réception de mon badge</h1>
    <p class="sous-texte">Signez dans le cadre ci-dessous pour confirmer que vous avez bien reçu votre badge. Un récépissé vous sera envoyé par mail.</p>
    <canvas class="zone-signature" id="zoneSignature"></canvas>
    <div class="actions-remise">
      <button type="button" class="bouton-secondaire" id="btnEffacerSignature">Effacer</button>
      <button type="button" class="bouton-principal" id="btnValiderRemise">Valider</button>
    </div>
    <div class="message-remise" id="messageRemise"></div>
    <button type="button" class="lien-remise" id="btnFermerRemise">Retour</button>
  </div>

  <div class="resultat" id="resultat">
    <div class="nom-adherent" id="nomAdherent"></div>
    <div class="annee">2027</div>
    <div class="sous-texte">Adhésion validée</div>

    <div class="infos-urgence" id="infosUrgence">
      <h2>En cas d'urgence</h2>
      <div class="info-ligne">
        <div class="info-etiquette">Personne à prévenir</div>
        <div class="info-valeur" id="personneAPrevenir"></div>
      </div>
      <div class="info-ligne">
        <div class="info-etiquette">Groupe sanguin</div>
        <div class="info-valeur" id="groupeSanguin"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Code attendu (haché de façon simple — voir remarque de sécurité)
  const CODE_ATTENDU = "1529";

  const champs = document.querySelectorAll('#champCode input');
  const messageErreur = document.getElementById('messageErreur');
  const champCode = document.getElementById('champCode');
  const formulaire = document.getElementById('formulaire');
  const resultat = document.getElementById('resultat');
  const nomAdherent = document.getElementById('nomAdherent');

  // Récupère l'identifiant de la personne depuis l'URL du QR code (?id=jean-dupont)
  const parametres = new URLSearchParams(window.location.search);
  const identifiant = parametres.get('id');

  // Clé personnelle du QR code (#k=...). Elle est après le "#" : le navigateur
  // ne l'envoie jamais au serveur. Sans elle, les infos d'urgence restent illisibles.
  const clePersonnelle = new URLSearchParams(window.location.hash.replace(/^#/, '')).get('k');

  const infosUrgence = document.getElementById('infosUrgence');
  const personneAPrevenir = document.getElementById('personneAPrevenir');
  const groupeSanguin = document.getElementById('groupeSanguin');

  // Décode du base64 (standard ou "url-safe", avec ou sans "=") en octets
  function base64VersOctets(texte) {
    let b64 = texte.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const binaire = atob(b64);
    const octets = new Uint8Array(binaire.length);
    for (let i = 0; i < binaire.length; i++) octets[i] = binaire.charCodeAt(i);
    return octets;
  }

  // Déchiffre (AES-GCM) les infos d'urgence : 12 octets d'IV puis texte chiffré.
  // Renvoie null si la clé est absente ou fausse : rien n'est alors affiché.
  async function dechiffrerInfos(infosChiffrees, cleBase64) {
    try {
      if (!infosChiffrees || !cleBase64 || !window.crypto || !crypto.subtle) return null;
      const donnees = base64VersOctets(infosChiffrees);
      const cle = await crypto.subtle.importKey(
        'raw', base64VersOctets(cleBase64), { name: 'AES-GCM' }, false, ['decrypt']);
      const clair = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: donnees.slice(0, 12) }, cle, donnees.slice(12));
      return JSON.parse(new TextDecoder().decode(clair));
    } catch (erreur) {
      return null;
    }
  }

  function afficherValeur(element, valeur) {
    const texte = (valeur || '').trim();
    element.textContent = texte || 'Non renseigné';
    element.classList.toggle('vide', !texte);
  }

  champs.forEach((champ, index) => {
    champ.addEventListener('input', () => {
      champ.value = champ.value.replace(/[^0-9]/g, '');
      if (champ.value && index < champs.length - 1) {
        champs[index + 1].focus();
      }
      verifierSiComplet();
    });

    champ.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !champ.value && index > 0) {
        champs[index - 1].focus();
      }
    });
  });

  async function recupererNom(id) {
    try {
      const reponse = await fetch('adherents.json');
      const annuaire = await reponse.json();
      return annuaire[id] || null;
    } catch (erreur) {
      return null;
    }
  }

  async function verifierSiComplet() {
    const code = Array.from(champs).map(c => c.value).join('');
    if (code.length === 4) {
      if (code === CODE_ATTENDU) {
        // Affiche le nom/prénom si l'identifiant est reconnu
        if (identifiant) {
          const personne = await recupererNom(identifiant);
          if (personne) {
            nomAdherent.textContent = `${personne.prenom} ${personne.nom}`;

            // Infos d'urgence : uniquement si le QR code contient la bonne clé
            // ET que le code à 4 chiffres vient d'être saisi correctement.
            const infos = await dechiffrerInfos(personne.infos, clePersonnelle);
            if (infos) {
              afficherValeur(personneAPrevenir, infos.personne_a_prevenir);
              afficherValeur(groupeSanguin, infos.groupe_sanguin);
              infosUrgence.classList.add('visible');
            }
          }
        }
        formulaire.classList.add('masque');
        resultat.classList.add('visible');
      } else {
        messageErreur.textContent = 'Code incorrect';
        champCode.classList.add('erreur');
        setTimeout(() => {
          champCode.classList.remove('erreur');
          champs.forEach(c => c.value = '');
          champs[0].focus();
          messageErreur.textContent = '';
        }, 600);
      }
    }
  }

  // ====== Confirmation de réception du badge (signature + récépissé par mail) ======
  // Adresse de l'application web Google (elle se termine par /exec). Tant qu'elle est
  // vide, cette fonction est désactivée et le site se comporte exactement comme avant.
  const URL_REMISE = "https://script.google.com/macros/s/AKfycby7NdUywO_3f1vXEelii-c39pvHb3S1lWr9N7ZudHlOnciVGq_mAoxTZIDYkdj3kqPI/exec";

  const blocRemise = document.getElementById('blocRemise');
  const panneauRemise = document.getElementById('panneauRemise');
  const zoneSignature = document.getElementById('zoneSignature');
  const messageRemise = document.getElementById('messageRemise');
  const btnValiderRemise = document.getElementById('btnValiderRemise');
  let ctxSignature = null;
  let enTrain = false;
  let aSigne = false;

  // La clé du QR code ne quitte jamais le téléphone : on n'envoie que son empreinte
  // (SHA-256 de "remise:" + clé), qui prouve qu'on a le badge sans révéler la clé
  // qui déchiffre les infos d'urgence.
  async function preuveBadge() {
    const octets = new TextEncoder().encode('remise:' + clePersonnelle);
    const empreinte = await crypto.subtle.digest('SHA-256', octets);
    return Array.from(new Uint8Array(empreinte)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Le bouton n'apparaît que si le badge n'a pas encore été confirmé.
  async function verifierStatutRemise() {
    if (!URL_REMISE || !identifiant || !clePersonnelle || !window.crypto || !crypto.subtle) return;
    try {
      const preuve = await preuveBadge();
      const reponse = await fetch(URL_REMISE + '?action=statut&id=' + encodeURIComponent(identifiant)
        + '&preuve=' + preuve);
      const donnees = await reponse.json();
      if (donnees && donnees.ok && donnees.remis === false) blocRemise.classList.add('visible');
    } catch (erreur) {
      // En cas de souci réseau, le site continue de fonctionner comme avant.
    }
  }

  function preparerSignature() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    zoneSignature.width = zoneSignature.clientWidth * ratio;
    zoneSignature.height = zoneSignature.clientHeight * ratio;
    ctxSignature = zoneSignature.getContext('2d');
    ctxSignature.scale(ratio, ratio);
    ctxSignature.lineWidth = 2.2;
    ctxSignature.lineCap = 'round';
    ctxSignature.lineJoin = 'round';
    ctxSignature.strokeStyle = '#111111';
    aSigne = false;
  }

  function positionDansSignature(evenement) {
    const rect = zoneSignature.getBoundingClientRect();
    return { x: evenement.clientX - rect.left, y: evenement.clientY - rect.top };
  }

  zoneSignature.addEventListener('pointerdown', (e) => {
    if (!ctxSignature) return;
    zoneSignature.setPointerCapture(e.pointerId);
    enTrain = true;
    aSigne = true;
    const p = positionDansSignature(e);
    ctxSignature.beginPath();
    ctxSignature.moveTo(p.x, p.y);
    ctxSignature.lineTo(p.x + 0.01, p.y);
    ctxSignature.stroke();
    e.preventDefault();
  });

  zoneSignature.addEventListener('pointermove', (e) => {
    if (!enTrain) return;
    const p = positionDansSignature(e);
    ctxSignature.lineTo(p.x, p.y);
    ctxSignature.stroke();
    e.preventDefault();
  });

  ['pointerup', 'pointercancel'].forEach(nom =>
    zoneSignature.addEventListener(nom, () => { enTrain = false; }));

  function afficherMessageRemise(texte, succes) {
    messageRemise.textContent = texte;
    messageRemise.classList.toggle('succes', !!succes);
  }

  document.getElementById('btnOuvrirRemise').addEventListener('click', () => {
    formulaire.classList.add('masque');
    panneauRemise.classList.add('visible');
    afficherMessageRemise('');
    btnValiderRemise.disabled = false;
    preparerSignature();
  });

  document.getElementById('btnEffacerSignature').addEventListener('click', preparerSignature);

  document.getElementById('btnFermerRemise').addEventListener('click', () => {
    panneauRemise.classList.remove('visible');
    formulaire.classList.remove('masque');
    champs[0].focus();
  });

  btnValiderRemise.addEventListener('click', async () => {
    if (!aSigne) {
      afficherMessageRemise('Merci de signer dans le cadre.');
      return;
    }
    btnValiderRemise.disabled = true;
    afficherMessageRemise('Envoi en cours…');
    try {
      const reponse = await fetch(URL_REMISE, {
        method: 'POST',
        // text/plain : évite la pré-vérification CORS que Google Apps Script ne gère pas
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'confirmer',
          id: identifiant,
          preuve: await preuveBadge(),
          signature: zoneSignature.toDataURL('image/png')
        })
      });
      const donnees = await reponse.json();
      if (donnees && donnees.ok) {
        blocRemise.classList.remove('visible');
        if (donnees.mail === 'oui') {
          afficherMessageRemise('Merci ! Votre récépissé vient de vous être envoyé par mail.', true);
        } else if (donnees.mail === 'en attente') {
          afficherMessageRemise('Merci ! Réception enregistrée. Votre récépissé vous sera envoyé par mail sous peu.', true);
        } else {
          afficherMessageRemise('Merci ! Réception enregistrée. Aucune adresse mail connue : le récépissé ne peut pas vous être envoyé.', true);
        }
      } else if (donnees && donnees.deja) {
        blocRemise.classList.remove('visible');
        afficherMessageRemise('La réception de ce badge a déjà été confirmée.', true);
      } else {
        afficherMessageRemise("Impossible d'enregistrer la confirmation. Réessayez ou contactez l'association.");
        btnValiderRemise.disabled = false;
      }
    } catch (erreur) {
      afficherMessageRemise('Connexion impossible. Vérifiez votre réseau et réessayez.');
      btnValiderRemise.disabled = false;
    }
  });

  verifierStatutRemise();

  champs[0].focus();
</script>

</body>
</html>
